<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>OG Image ・ 1200×630 (書き出し用)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700;800&family=Yusei+Magic&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F6EFE4;
    --paper: #FFFCF7;
    --ink: #2A201A;
    --ink2: #6F5F52;
    --line: #E6DAC5;
    --accent: #B5572E;
    --accent-soft: #E9C7AE;
    --celebration: #C28534;
    --wedding: #B5485C;
    --funeral: #6E5380;
    --tape: rgba(212, 184, 128, 0.55);
    --serif: "Noto Serif JP", serif;
    --sans: "Noto Sans JP", system-ui, sans-serif;
    --hand: "Yusei Magic", "Noto Serif JP", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #444; }
  body { padding: 32px; display: grid; place-items: center; min-height: 100vh; font-family: var(--sans); }

  .og-frame {
    width: 1200px; height: 630px; flex-shrink: 0;
    background:
      radial-gradient(circle at 80% 0%, rgba(233, 199, 174, 0.65), transparent 50%),
      radial-gradient(circle at 0% 100%, rgba(181, 87, 46, 0.18), transparent 50%),
      var(--bg);
    position: relative; overflow: hidden;
    display: flex; align-items: center; padding: 70px;
    color: var(--ink);
    border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.3);
  }
  .og-frame::before {
    content: ''; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.07) 0 1px, transparent 1px 24px);
    pointer-events: none;
  }
  .content { position: relative; z-index: 2; max-width: 60%; }
  .eyebrow {
    font-family: var(--serif); font-size: 16px; color: var(--accent);
    letter-spacing: 8px; font-weight: 500; margin-bottom: 18px;
    display: inline-flex; align-items: center; gap: 12px;
  }
  .eyebrow .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
  }
  h2 {
    font-family: var(--serif); font-size: 68px; font-weight: 600;
    line-height: 1.2; margin: 0 0 22px; letter-spacing: -1.5px;
  }
  h2 em { font-style: italic; color: var(--accent); font-weight: 700; }
  .desc {
    font-family: var(--serif); font-size: 20px; color: var(--ink2);
    line-height: 1.85; margin: 0 0 28px; font-weight: 400;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 32px;
    background: var(--accent); color: #fff;
    border-radius: 999px; font-family: var(--serif);
    font-size: 18px; font-weight: 600;
    box-shadow: 0 8px 22px rgba(181, 87, 46, 0.3);
  }
  .logo {
    position: absolute; top: 40px; right: 60px;
    z-index: 2;
    font-family: var(--serif); font-size: 28px; font-weight: 600;
    color: var(--ink); letter-spacing: -0.5px; text-align: right;
  }
  .logo small {
    display: block; font-family: var(--serif); font-size: 10px;
    color: var(--accent); letter-spacing: 5px; margin-top: 2px; font-weight: 500;
  }

  .visual { position: absolute; right: 50px; top: 0; bottom: 0; width: 40%; }
  .polaroid {
    position: absolute; background: var(--paper);
    padding: 14px 14px 22px;
    box-shadow: 0 18px 40px rgba(60, 40, 20, 0.18), 0 4px 10px rgba(60, 40, 20, 0.1);
    width: 240px;
  }
  .polaroid::before {
    content: ''; position: absolute; top: -10px; left: 50%;
    transform: translateX(-50%) rotate(2deg);
    width: 70px; height: 20px; background: var(--tape);
  }
  .polaroid .pic {
    width: 100%; aspect-ratio: 1.1 / 1;
    display: grid; place-items: center;
    position: relative; overflow: hidden;
  }
  .polaroid .pic::after {
    content: ''; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.2) 0 1px, transparent 1px 14px);
  }
  .polaroid .ico {
    font-family: var(--serif); font-size: 64px;
    z-index: 1; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }
  .polaroid .cap {
    text-align: center; margin-top: 10px;
    font-family: var(--hand); font-size: 22px;
    color: var(--ink);
  }
  .polaroid.p1 {
    transform: rotate(-9deg); top: 80px; right: 110px; z-index: 3;
  }
  .polaroid.p1 .pic { background: linear-gradient(135deg, var(--celebration), var(--accent-soft)); }
  .polaroid.p2 {
    transform: rotate(7deg); top: 240px; right: 30px; z-index: 2;
  }
  .polaroid.p2 .pic { background: linear-gradient(135deg, var(--wedding), var(--accent-soft)); }
  .polaroid.p3 {
    transform: rotate(-3deg); bottom: 30px; right: 180px;
    width: 200px;
  }
  .polaroid.p3 .pic { background: linear-gradient(135deg, var(--funeral), var(--accent-soft)); }

  .hint {
    position: fixed; top: 14px; left: 14px;
    color: #fff; font-family: var(--sans); font-size: 12px; opacity: 0.6;
    background: rgba(0,0,0,0.4); padding: 8px 14px; border-radius: 8px;
  }
</style>
</head>
<body>

<div class="hint">
  📸 この枠（1200×630px）をスクリーンショットで撮って <code>og-image.png</code> として保存し、lp-final.html と同じ階層に配置
</div>

<div class="og-frame" id="og-frame">

  <div class="logo">
    LifePath
    <small>ライフ・パス</small>
  </div>

  <div class="content">
    <div class="eyebrow"><span class="dot"></span>2026 ローンチ予定</div>
    <h2>人生にも、<br/><em>ガントチャート</em>を。</h2>
    <div class="desc">
      七五三・入学・結婚式・葬儀まで。<br/>
      家族の節目を抜け漏れなく準備するアプリ。
    </div>
    <div class="cta">事前登録はこちら →</div>
  </div>

  <div class="visual">
    <div class="polaroid p1">
      <div class="pic"><div class="ico">👶</div></div>
      <div class="cap">蓮の七五三</div>
    </div>
    <div class="polaroid p2">
      <div class="pic"><div class="ico">💍</div></div>
      <div class="cap">妹の結婚式</div>
    </div>
    <div class="polaroid p3">
      <div class="pic"><div class="ico">🌸</div></div>
      <div class="cap">葵の入園</div>
    </div>
  </div>

</div>

</body>
</html>
