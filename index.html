<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>LifePath ・ A案 全体ワイヤーフレーム</title>
<meta name="viewport" content="width=1600" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600;700;800&family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #ECE7DE; font-family: "Noto Sans JP", system-ui, sans-serif; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="screens/variation-a.jsx"></script>
<script type="text/babel" src="screens/a-auth.jsx"></script>
<script type="text/babel" src="screens/a-extra.jsx"></script>
<script type="text/babel" src="screens/a-event-detail.jsx"></script>
<script type="text/babel" src="screens/variation-b.jsx"></script>
<script type="text/babel" src="screens/variation-c.jsx"></script>

<script type="text/babel">
function Phone({ children }) {
  return (
    <div style={{
      width: 390, height: 800, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: '#000',
      boxShadow: '0 30px 60px rgba(60,40,20,0.18), 0 0 0 8px #1c1410, 0 0 0 9px rgba(0,0,0,0.4)',
    }}>
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 110, height: 30, borderRadius: 20, background: '#000', zIndex: 50,
      }} />
      <div style={{
        position: 'absolute', top: 14, right: 36, color: '#000', fontSize: 14,
        fontWeight: 600, zIndex: 40, fontFamily: '-apple-system',
      }}>● ● ●</div>
      <div style={{
        position: 'absolute', top: 14, left: 36, fontSize: 14, fontWeight: 700,
        zIndex: 40, fontFamily: '-apple-system, system-ui',
      }}>9:41</div>
      {children}
    </div>
  );
}

// UX review card (as artboard content)
function UXNote({ title, severity, body }) {
  const sev = {
    'high':   { c: '#B33A2B', l: '要対応' },
    'medium': { c: '#C28534', l: '改善' },
    'low':    { c: '#5A8C5C', l: '提案' },
  }[severity];
  return (
    <div style={{
      width: 380, minHeight: 280, padding: '20px 22px',
      background: '#FFFCF7', border: '1px solid #E6DAC5', borderRadius: 18,
      fontFamily: '"Noto Sans JP", system-ui, sans-serif', color: '#2A201A',
      display: 'flex', flexDirection: 'column', gap: 10,
    }}>
      <div style={{
        display: 'inline-block', alignSelf: 'flex-start',
        fontSize: 10, fontWeight: 800, letterSpacing: 1.5,
        color: '#fff', background: sev.c, padding: '3px 10px', borderRadius: 999,
      }}>{sev.l}</div>
      <div style={{ fontFamily: '"Noto Serif JP", serif', fontSize: 17, fontWeight: 700, lineHeight: 1.35 }}>{title}</div>
      <div style={{ fontSize: 13, color: '#6F5F52', lineHeight: 1.75, whiteSpace: 'pre-wrap' }}>{body}</div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas title="LifePath ・ A案 全体ワイヤーフレーム → カンプ" bg="#ECE7DE">

      {/* ============================================================ */}
      {/* SECTION 1: 認証 & オンボーディング */}
      {/* ============================================================ */}
      <DCSection id="auth" title="① 認証 ・ オンボーディング" subtitle="ログイン → スライド → 自動年表ウィザード → 生成プレビュー">
        <DCArtboard id="auth-login" label="ログイン" width={390} height={800}>
          <Phone><LoginA /></Phone>
        </DCArtboard>
        <DCArtboard id="auth-on1" label="① 紹介スライド（3枚）" width={390} height={800}>
          <Phone><OnboardingA1 /></Phone>
        </DCArtboard>
        <DCArtboard id="auth-on2" label="② プロフィール入力" width={390} height={800}>
          <Phone><OnboardingA2 /></Phone>
        </DCArtboard>
        <DCArtboard id="auth-on3" label="③ 年表自動生成プレビュー" width={390} height={800}>
          <Phone><OnboardingA3 /></Phone>
        </DCArtboard>
      </DCSection>

      {/* ============================================================ */}
      {/* SECTION 2: ホーム 4タブ */}
      {/* ============================================================ */}
      <DCSection id="tabs" title="② ホーム ・ メイン4タブ" subtitle="カルーセル型ホーム + カレンダー + 年表 + 設定">
        <DCArtboard id="t-home" label="ホーム（複数イベントカルーセル）" width={390} height={800}>
          <Phone><HomeA /></Phone>
        </DCArtboard>
        <DCArtboard id="t-cal" label="カレンダー" width={390} height={800}>
          <Phone><CalendarA /></Phone>
        </DCArtboard>
        <DCArtboard id="t-tl" label="年表" width={390} height={800}>
          <Phone><TimelineA /></Phone>
        </DCArtboard>
        <DCArtboard id="t-set" label="設定" width={390} height={800}>
          <Phone><SettingsA /></Phone>
        </DCArtboard>
      </DCSection>

      {/* ============================================================ */}
      {/* SECTION 3: イベント作成フロー */}
      {/* ============================================================ */}
      <DCSection id="create" title="③ イベント作成フロー" subtitle="手動入力 / 種別ドロップダウン / 手動タスク / AI相談チャット / AIプラン">
        <DCArtboard id="c-new" label="① 新規イベント作成" width={390} height={800}>
          <Phone><NewEventA /></Phone>
        </DCArtboard>
        <DCArtboard id="c-type" label="② 種別ピッカー（24テーマ）" width={390} height={800}>
          <Phone><EventTypePickerA /></Phone>
        </DCArtboard>
        <DCArtboard id="c-task" label="③ タスク追加シート" width={390} height={800}>
          <Phone><TaskAddSheetA /></Phone>
        </DCArtboard>
        <DCArtboard id="c-ai1" label="④ AIチャット（目的ヒアリング）" width={390} height={800}>
          <Phone><AIChatA /></Phone>
        </DCArtboard>
        <DCArtboard id="c-ai2" label="⑤ AIプランの確認" width={390} height={800}>
          <Phone><AIPlanPreviewA /></Phone>
        </DCArtboard>
      </DCSection>

      {/* ============================================================ */}
      {/* SECTION 4: イベント詳細 5タブ */}
      {/* ============================================================ */}
      <DCSection id="detail" title="④ イベント詳細 ・ 5タブ" subtitle="概要 / タスク / ゲスト / お金 / メモ + 共有">
        <DCArtboard id="d-ov" label="① 概要" width={390} height={800}>
          <Phone><EventOverviewA /></Phone>
        </DCArtboard>
        <DCArtboard id="d-ta" label="② タスク（フェーズ別）" width={390} height={800}>
          <Phone><EventTasksA /></Phone>
        </DCArtboard>
        <DCArtboard id="d-gu" label="③ ゲスト" width={390} height={800}>
          <Phone><EventGuestsA /></Phone>
        </DCArtboard>
        <DCArtboard id="d-mo" label="④ お金（予算 + 記録）" width={390} height={800}>
          <Phone><EventMoneyA /></Phone>
        </DCArtboard>
        <DCArtboard id="d-no" label="⑤ メモ（添付ファイル含む）" width={390} height={800}>
          <Phone><EventNotesA /></Phone>
        </DCArtboard>
        <DCArtboard id="d-sh" label="共有（招待リンク + 権限）" width={390} height={800}>
          <Phone><ShareA /></Phone>
        </DCArtboard>
      </DCSection>

      {/* ============================================================ */}
      {/* SECTION 5: 外部連携 */}
      {/* ============================================================ */}
      <DCSection id="int" title="⑤ 外部サービス連携" subtitle="設定から入り、イベント種別ごとに出湧。法律家など今後拡充予定">
        <DCArtboard id="i-list" label="連携サービス 一覧" width={390} height={800}>
          <Phone><IntegrationsA /></Phone>
        </DCArtboard>
        <DCArtboard id="i-detail" label="サービス詳細（着付けレンタル）" width={390} height={800}>
          <Phone><IntegrationDetailA /></Phone>
        </DCArtboard>
      </DCSection>

      {/* ============================================================ */}
      {/* SECTION 6: UX レビュー */}
      {/* ============================================================ */}
      <DCSection id="ux" title="⑥ UX レビュー ・ 不足項目と改善提案" subtitle="現状の画面遷移を見直して気付いた点 ・ 優先度順">

        <DCArtboard id="ux1" label="① 進捗の可視化が弱い" width={380} height={280}>
          <UXNote
            severity="high"
            title="ホームから自分の「全体進捗」が見えない"
            body={"現状はイベントごとの進捗バーがあるだけ。\n\n推奨：ホーム上部に「今月の準備 16/45 タスク完了」のような家族全体の進捗指標を追加。年表とも連動。\n\nまたカレンダーは「予定」中心だが、タスク期限のヒートマップ表示で「忙しさ」が直感的にわかると良い。"}
          />
        </DCArtboard>

        <DCArtboard id="ux2" label="② オンボーディング離脱対策" width={380} height={280}>
          <UXNote
            severity="high"
            title="入力項目が多くて離脱しそう"
            body={"現状：ニックネーム / 氏名 / 生年月日 / 居住地 / メール / パスワード / 規約同意 が1ページに。\n\n推奨：3ステップに分割（① 名前、② 生年月日と地域、③ メール認証）。各ステップで生成される年表のプレビューを見せて「あと一歩」感を出す。\n\nまた、デモアカウントから入り、後から会員化する導線も用意したい。"}
          />
        </DCArtboard>

        <DCArtboard id="ux3" label="③ AI機能の発見性" width={380} height={280}>
          <UXNote
            severity="high"
            title="AIで何ができるかが伝わりにくい"
            body={"AI FABが「相談」とだけ書かれており、初見ユーザーは何を相談していいか分からない。\n\n推奨：\n・ ホームに「AIで30秒でイベント計画を作る」初回ガイド付きCTA\n・ ボタン文言を「AIで計画を作る」に変更\n・ AIチャット冒頭で代表的なクイック質問（七五三 / 結婚式 / 退職祝い）をボタン化"}
          />
        </DCArtboard>

        <DCArtboard id="ux4" label="④ タスク担当の見える化" width={380} height={280}>
          <UXNote
            severity="medium"
            title="家族で誰が何を担当か一覧で見たい"
            body={"現状：タスクごとに担当者を割り当てられるが、一覧で「自分担当のタスク」が絞り込めない。\n\n推奨：\n・ ホームに「私の担当タスク」ウィジェット\n・ ゲストタブまたは新規「担当」ビューでメンバー別タスク表示\n・ プッシュ通知で「夫に未完了タスク3件あり」のリマインド"}
          />
        </DCArtboard>

        <DCArtboard id="ux5" label="⑤ 検索が薄い" width={380} height={280}>
          <UXNote
            severity="medium"
            title="グローバル検索が無く回遊しづらい"
            body={"app/search.tsx は存在するが導線が見えない。年表が増えると探しにくい。\n\n推奨：\n・ ホーム上部の検索ボックス（イベント・タスク・ゲスト横断）\n・ 検索候補：「先月の支出」「祖父」「七五三」など自然文OK\n・ 過去の似たイベントから「テンプレートとして複製」"}
          />
        </DCArtboard>

        <DCArtboard id="ux6" label="⑥ 共有後の権限と通知" width={380} height={280}>
          <UXNote
            severity="medium"
            title="共有メンバーへの通知設計"
            body={"招待リンクは設計済みだが、共有後にどのアクションが共有されるか不明確。\n\n推奨：\n・ 共有メンバーの操作をフィードに表示（「健太がタスクを完了しました」）\n・ アクティビティタブ、または「メモ」タブをタイムライン型のチャットに進化\n・ 重要な変更（日付変更等）は通知必須"}
          />
        </DCArtboard>

        <DCArtboard id="ux7" label="⑦ お金 ・ 予算超過の対応" width={380} height={280}>
          <UXNote
            severity="medium"
            title="予算超過時の体験が冷たい"
            body={"超過するとエラー色だけ表示。次のアクションが提示されない。\n\n推奨：\n・「予算を見直す / 支出を削減候補」ボタン\n・ 同じ種別のイベントの平均支出と比較（七五三の家族の平均：¥85,000）\n・ 招待ゲストからの祝儀予測を加味した収支見込み"}
          />
        </DCArtboard>

        <DCArtboard id="ux8" label="⑧ 不足画面" width={380} height={280}>
          <UXNote
            severity="low"
            title="現状コードに無い／薄い画面"
            body={"・ プロフィール編集（profile.tsx はあるが情報が薄い）\n・ 通知センター（プッシュ通知の履歴を見る画面）\n・ アクティビティ／変更履歴（誰がいつ何をしたか）\n・ アーカイブ（終了したイベントの整理）\n・ ヘルプ／FAQ\n・ アップグレード後のサンクス画面"}
          />
        </DCArtboard>

        <DCArtboard id="ux9" label="⑨ 画面遷移ロス" width={380} height={280}>
          <UXNote
            severity="low"
            title="戻る／タブ切替の状態保持"
            body={"イベント詳細のタブ位置やフィルタ状態が戻ると失われる懸念。\n\n推奨：\n・ URL に tab パラメータを反映 (?tab=tasks)\n・ 戻るボタンで前のタブ位置を保持\n・ カレンダーの月切り替えも同様に保持\n\nまた、AI相談シートを閉じても下書きは残るよう既に実装あり ✓"}
          />
        </DCArtboard>

        <DCArtboard id="ux10" label="⑩ コピーライティング" width={380} height={280}>
          <UXNote
            severity="low"
            title="温度感の統一"
            body={"A案の世界観（温かい家族アルバム）に合わせ、コピーをもう少し人間味のあるトーンへ。\n\n例：\n・「タスクを追加」→「やることを書き留める」\n・「招待数」→「お招きする方」\n・「収支」→「お金のやりくり」\n・「次にやること」→「もうすぐの予定」\n\nUI構造はそのままで、文言だけ調整すると印象が大きく変わる。"}
          />
        </DCArtboard>

      </DCSection>

      {/* ============================================================ */}
      {/* SECTION 7: B / C 参考バリエーション（折り畳み代わりに最後に） */}
      {/* ============================================================ */}
      <DCSection id="ref-b" title="参考 ・ B案（エディトリアル・ノワール）" subtitle="採用しない案。トーン比較用">
        <DCArtboard id="b-home" label="ホーム" width={390} height={800}><Phone><HomeB /></Phone></DCArtboard>
        <DCArtboard id="b-cal" label="カレンダー" width={390} height={800}><Phone><CalendarB /></Phone></DCArtboard>
        <DCArtboard id="b-tl" label="年表" width={390} height={800}><Phone><TimelineB /></Phone></DCArtboard>
        <DCArtboard id="b-set" label="設定" width={390} height={800}><Phone><SettingsB /></Phone></DCArtboard>
      </DCSection>

      <DCSection id="ref-c" title="参考 ・ C案（アーキテクチャル・ミニマル）" subtitle="採用しない案。トーン比較用">
        <DCArtboard id="c-home" label="ホーム" width={390} height={800}><Phone><HomeC /></Phone></DCArtboard>
        <DCArtboard id="c-cal" label="カレンダー" width={390} height={800}><Phone><CalendarC /></Phone></DCArtboard>
        <DCArtboard id="c-tl" label="年表" width={390} height={800}><Phone><TimelineC /></Phone></DCArtboard>
        <DCArtboard id="c-set" label="設定" width={390} height={800}><Phone><SettingsC /></Phone></DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
